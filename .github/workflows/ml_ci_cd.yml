name: Poker ModelOps CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  repository_dispatch:
    types: [ml_ci_cd]

permissions:
  contents: read

jobs:
  train-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download dataset from Cloudinary
        if: github.event_name == 'repository_dispatch'
        env:
          DATASET_URL: ${{ github.event.client_payload.dataseturl }}
        run: |
          if [[ -z "$DATASET_URL" ]]; then
            echo "Error: dataseturl was not provided."
            exit 1
          fi

          case "$DATASET_URL" in
            https://res.cloudinary.com/*) ;;
            *)
              echo "Error: expected a Cloudinary URL."
              exit 1
              ;;
          esac

          mkdir -p datasets

          curl --fail --location --silent --show-error --retry 3 \
            "$DATASET_URL" \
            --output datasets/poker-hand-training-input.csv

          python - <<'PY'
          import pandas as pd

          path = "datasets/poker-hand-training-input.csv"
          df = pd.read_csv(path)

          if df.empty:
              raise SystemExit("Error: the dataset is empty.")

          if "Poker Hand" not in df.columns:
              raise SystemExit("Error: missing 'Poker Hand' column.")

          if len(df.columns) != 11:
              raise SystemExit(
                  f"Expected 11 columns, found {len(df.columns)}."
              )

          print(
              f"Dataset validated: {len(df)} rows, "
              f"{len(df.columns)} columns."
          )
          PY

      - name: Train XGBoost model
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            DATASET_PATH="datasets/poker-hand-training-input.csv"
          else
            DATASET_PATH="poker-hand-training.csv"
          fi

          python xgboost_poker.py \
            "$DATASET_PATH" \
            "model/xgboost_poker.joblib"

      - name: Verify trained model
        run: |
          python - <<'PY'
          from pathlib import Path
          from joblib import load

          path = Path("model/xgboost_poker.joblib")

          if not path.exists():
              raise SystemExit("Error: trained model was not generated.")

          model = load(path)

          print("Model loaded successfully.")
          print(f"Model file size: {path.stat().st_size} bytes.")
          print(f"Model type: {type(model).__name__}")
          PY

      - name: Prepare Docker image tag
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          MODEL_TAG: ${{ github.event.client_payload.sha || github.sha }}
        run: |
          if [[ -z "$DOCKER_USER" || -z "$MODEL_NAME" ]]; then
            echo "Error: configure DOCKER_USER and MODEL_NAME in GitHub Secrets."
            exit 1
          fi

          if [[ ! "$MODEL_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Error: invalid Docker image tag."
            exit 1
          fi

          echo "IMAGE_TAG=${DOCKER_USER}/${MODEL_NAME}:${MODEL_TAG}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        run: docker build --pull -t "$IMAGE_TAG" .

      - name: Push Docker image
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        run: docker push "$IMAGE_TAG"

      - name: Show published image
        if: github.event_name == 'push' || github.event_name == 'repository_dispatch'
        run: |
          echo "Published image: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"